services:
  postgres:
    image: postgres:16-alpine
    container_name: shivaddi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shivaddi
      POSTGRES_PASSWORD: shivaddi_dev_password
      POSTGRES_DB: shivaddi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivaddi -d shivaddi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: